name: ciln

services:
  pgsql:
    image: postgres:18
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: "${DB_DATABASE:-ciln}"
      POSTGRES_USER: "${DB_USERNAME:-ciln}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-secret}"
    volumes:
      - pgsql-data:/var/lib/postgresql
      - ./docker/pgsql/create-testing-database.sql:/docker-entrypoint-initdb.d/10-create-testing-database.sql
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-d", "${DB_DATABASE:-ciln}", "-U", "${DB_USERNAME:-ciln}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgsql-data:
